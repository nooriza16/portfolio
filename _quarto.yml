project:
  type: website
  output-dir: docs

website:
  title: "Portfolio"
  navbar:
    background: "#111"        # dark navbar background
    foreground: "white"       # white text
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects

format:
  html:
    theme:
      - default   # 🟢 Theme name on its own line
    css: styles.css  # 🟢 Your custom stylesheet AFTER the theme
    toc: true
    include-after-body:
      - text: |
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


jupyter: python3
editor: visual
